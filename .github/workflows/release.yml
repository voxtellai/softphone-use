name: Release

# Push a tag like v0.2.0 after `pnpm release:version 0.2.0` is merged. This builds every
# platform, publishes the npm packages and attaches the binaries to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { platform: darwin-x64, os: macos-15, target: x86_64-apple-darwin, cross: true }
          - { platform: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: win32-x64, os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The tag matches the version
        shell: bash
        run: node scripts/npm.mjs check "${GITHUB_REF_NAME#v}"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libwayland-dev libxkbcommon-dev libudev-dev libfontconfig1-dev
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Collect
        shell: bash
        run: |
          exe=softphone-use
          if [ "$RUNNER_OS" = Windows ]; then exe=softphone-use.exe; fi
          mkdir -p "dist/${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/$exe" "dist/${{ matrix.platform }}/"
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: dist/${{ matrix.platform }}/softphone-use* --version
      - uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.platform }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-22.04
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          pattern: bin-*
          merge-multiple: true
          path: artifacts
      - name: Stage npm packages
        run: node scripts/npm.mjs stage artifacts dist/npm
      - uses: actions/upload-artifact@v5
        with:
          name: npm-packages
          path: dist/npm
      # Without an NPM_TOKEN secret, publish by hand from the npm-packages artifact:
      # node scripts/npm.mjs publish <dir>
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: node scripts/npm.mjs publish dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          # npm provenance needs a public repository.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archives
          for dir in artifacts/*/; do
            platform=$(basename "$dir")
            name="softphone-use-${GITHUB_REF_NAME}-${platform}"
            if [ -f "$dir/softphone-use.exe" ]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/archives/$name.zip" softphone-use.exe)
            else
              chmod +x "$dir/softphone-use"
              tar -czf "archives/$name.tar.gz" -C "$dir" softphone-use
            fi
          done
          flags="--generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --title "$GITHUB_REF_NAME" archives/*
